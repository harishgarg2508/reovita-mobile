# Android APK for the health-ui branch, kept separate from mobile-builds.yml so the two build
# independently. Uploads the APK as a workflow artifact (Actions run page -> Artifacts section).
#
# Uses the same repository secrets as mobile-builds.yml (Firebase keys, GOOGLE_SERVICES_JSON,
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).

name: Android build (health UI)

on:
  push:
    branches:
      - feat/health-ui-build
  workflow_dispatch:

concurrency:
  group: android-health-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  android:
    name: Android APK (health UI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      REOVITA_RELEASE_STORE_FILE: /tmp/release.keystore
      REOVITA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      REOVITA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      REOVITA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # No `cache: gradle` here: android/ is generated by prebuild below, so
          # setup-java finds no Gradle files to hash at this point and fails.

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      # Caches the Gradle user home (dependencies + wrapper distribution). Runs after
      # prebuild and does not require Gradle files to exist in the checkout.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Raise Gradle memory for release build
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "android.useFullClasspathForDexingTransform=true" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Print APK signing fingerprints (register in Firebase for Google sign-in)
        run: |
          keytool -list -v -keystore /tmp/release.keystore -alias "$REOVITA_RELEASE_KEY_ALIAS" -storepass "$REOVITA_RELEASE_STORE_PASSWORD" | grep -E "SHA1|SHA256"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/reovita-android-health-ui.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: reovita-android-apk-health-ui
          path: artifacts/reovita-android-health-ui.apk
          if-no-files-found: error
          retention-days: 14
